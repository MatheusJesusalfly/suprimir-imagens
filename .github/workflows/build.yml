name: Gerar EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf lxml pyinstaller
      - run: python -m PyInstaller --onefile --console --name SuprimirImagens --clean suprimir_imagens.py
      - uses: actions/upload-artifact@v4
        with:
          name: SuprimirImagens
          path: dist/SuprimirImagens.exe
